[package]
name = "git-loom"
version = "0.2.2"
edition = "2024"
rust-version = "1.90"
description = "Manage Git work environments and linked repositories"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
walkdir = "2"
tempfile = "3"
